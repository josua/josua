name: Update profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate profile dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: josua
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Paris
          config_display: columns
          plugin_languages: yes
          plugin_languages_limit: 16
          plugin_languages_details: percentage
          base_indepth: yes
          repositories: 100
          repositories_affiliations: owner
          repositories_forks: yes

          extras_css: |
            @font-face {
              font-family: "Ubuntu derivative Metrics Latin";
              src: url("data:font/woff2;base64,") format("woff2");
              font-weight: 400;
              font-style: normal;
              font-display: block;
            }
            @font-face {
              font-family: "Plus Jakarta Sans";
              src: url("data:font/woff2;base64,") format("woff2");
              font-weight: 600;
              font-style: normal;
              font-display: block;
            }
            svg {
              font-family: "Ubuntu derivative Metrics Latin", Arial, sans-serif !important;
              font-size: 14px !important;
              font-weight: 400 !important;
              color: #b8c2cf !important;
            }
            h1, h2, h3 {
              font-family: "Plus Jakarta Sans", Arial, sans-serif !important;
              font-style: normal !important;
              font-weight: 600 !important;
              color: #79b8ff !important;
            }
